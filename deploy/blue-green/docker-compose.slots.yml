name: new-api-slots

services:
  new-api-blue:
    image: ${BLUE_IMAGE:?BLUE_IMAGE is required}
    container_name: new-api-blue
    restart: unless-stopped
    command: --log-dir /app/logs
    environment:
      - TZ=${TZ}
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - NODE_TYPE=slave
      - NODE_NAME=new-api-blue
    expose:
      - "3000"
    volumes:
      - /opt/new-api-stack/data-blue:/data
      - /opt/new-api-stack/logs-blue:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - new-api-net

  new-api-green:
    image: ${GREEN_IMAGE:?GREEN_IMAGE is required}
    container_name: new-api-green
    restart: unless-stopped
    command: --log-dir /app/logs
    environment:
      - TZ=${TZ}
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - NODE_TYPE=slave
      - NODE_NAME=new-api-green
    expose:
      - "3000"
    volumes:
      - /opt/new-api-stack/data-green:/data
      - /opt/new-api-stack/logs-green:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - new-api-net

  new-api-master:
    image: ${MASTER_IMAGE:?MASTER_IMAGE is required}
    container_name: new-api-master
    restart: unless-stopped
    command: --log-dir /app/logs
    environment:
      - TZ=${TZ}
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - NODE_TYPE=master
      - NODE_NAME=new-api-master
    expose:
      - "3000"
    volumes:
      - /opt/new-api-stack/data-master:/data
      - /opt/new-api-stack/logs-master:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - new-api-net

networks:
  new-api-net:
    external: true
    name: new-api-net
