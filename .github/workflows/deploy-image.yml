name: Build image and blue-green deploy

on:
  pull_request:
    branches:
      - aivrae/main
    paths-ignore:
      - 'data/blog-drafts/**'
      - 'docs/**'
      - '*.md'
  push:
    branches:
      - aivrae/main
    paths-ignore:
      - 'data/blog-drafts/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Production operation'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - preflight-upgrade
          - start-upgrade
          - finalize-upgrade
          - rollback-upgrade
      image_ref:
        description: 'Immutable image digest; required for deploy/preflight-upgrade/start-upgrade'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/blue-green/deploy-blue-green.sh \
            deploy/blue-green/upgrade-preflight.sh \
            deploy/blue-green/test-deploy-blue-green.sh \
            deploy/blue-green/observe-public.sh
          bash deploy/blue-green/test-deploy-blue-green.sh
          env \
            TZ=UTC \
            POSTGRES_USER=test \
            POSTGRES_PASSWORD=test \
            POSTGRES_DB=test \
            SESSION_SECRET=test \
            CRYPTO_SECRET=test \
            BLUE_IMAGE=example.invalid/new-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            GREEN_IMAGE=example.invalid/new-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            MASTER_IMAGE=example.invalid/new-api@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            docker compose -f deploy/blue-green/docker-compose.slots.yml config --quiet

      - name: Set up Go
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        if: github.event_name != 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        if: github.event_name != 'workflow_dispatch'
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        if: github.event_name != 'workflow_dispatch'
        working-directory: web/default
        run: bun run typecheck

      - name: Verify frontend i18n is synchronized
        if: github.event_name != 'workflow_dispatch'
        working-directory: web/default
        run: |
          bun run i18n:sync
          git diff --exit-code -- src/i18n/locales

      - name: Build default frontend
        if: github.event_name != 'workflow_dispatch'
        working-directory: web/default
        run: bun run build

      - name: Build classic frontend
        if: github.event_name != 'workflow_dispatch'
        working-directory: web/classic
        run: bun run build

      - name: Test backend
        if: github.event_name != 'workflow_dispatch'
        run: go test ./...

  build:
    name: Build immutable image
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd '[:alnum:].-')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          version="deploy-${safe_ref}-${short_sha}"

          printf '%s\n' "${version}" > VERSION
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "short-sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ vars.DEPLOY_IMAGE_PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repository }}:sha-${{ steps.image.outputs.short-sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: github.event_name == 'push'
        run: |
          echo '### Immutable image' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo '${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Pull request build summary
        if: github.event_name == 'pull_request'
        run: echo 'Container image build completed without pushing an image.' >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      OPERATION: ${{ inputs.operation }}
      IMAGE_REF: ${{ inputs.image_ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || 'root' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.VPS_NEW_API_PATH || '/opt/new-api-stack' }}
      DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
      DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
      SMOKE_TOKEN: ${{ secrets.DEPLOY_SMOKE_TOKEN }}
      SMOKE_MODEL: ${{ vars.DEPLOY_SMOKE_MODEL }}

    steps:
      - name: Validate production operation
        shell: bash
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            deploy|preflight-upgrade|start-upgrade)
              if ! [[ "${IMAGE_REF}" =~ ^[A-Za-z0-9._/:@-]+@sha256:[a-f0-9]{64}$ ]]; then
                echo '::error::image_ref must be an immutable image@sha256:digest reference'
                exit 1
              fi
              ;;
            finalize-upgrade|rollback-upgrade)
              ;;
            *)
              echo "::error::unsupported operation: ${OPERATION}"
              exit 1
              ;;
          esac

      - name: Check out deployment files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            deploy/blue-green

      - name: Validate deploy settings
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"

          if [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          else
            ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" > "${HOME}/.ssh/known_hosts"
          fi
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${DEPLOY_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 700 '${DEPLOY_PATH}'"

          scp \
            -i "${HOME}/.ssh/deploy_key" \
            -P "${DEPLOY_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/blue-green/docker-compose.slots.yml \
            deploy/blue-green/deploy-blue-green.sh \
            deploy/blue-green/upgrade-preflight.sh \
            deploy/blue-green/observe-public.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${DEPLOY_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '${DEPLOY_PATH}/deploy-blue-green.sh' '${DEPLOY_PATH}/upgrade-preflight.sh' '${DEPLOY_PATH}/observe-public.sh' && chmod 600 '${DEPLOY_PATH}/docker-compose.slots.yml'"

      - name: Run production operation
        shell: bash
        run: |
          set -euo pipefail
          quote() {
            printf '%q' "$1"
          }

          remote_command="DEPLOY_PATH=$(quote "${DEPLOY_PATH}") SMOKE_TOKEN=$(quote "${SMOKE_TOKEN}") SMOKE_MODEL=$(quote "${SMOKE_MODEL}") DEPLOY_REGISTRY_USERNAME=$(quote "${DEPLOY_REGISTRY_USERNAME}") DEPLOY_REGISTRY_TOKEN=$(quote "${DEPLOY_REGISTRY_TOKEN}") bash $(quote "${DEPLOY_PATH}/deploy-blue-green.sh") $(quote "${OPERATION}")"
          case "${OPERATION}" in
            deploy|preflight-upgrade|start-upgrade)
              remote_command="${remote_command} $(quote "${IMAGE_REF}")"
              ;;
          esac

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${DEPLOY_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${remote_command}"

      - name: Deployment summary
        run: |
          echo '### Production deployment' >> "${GITHUB_STEP_SUMMARY}"
          echo "Operation: ${OPERATION}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "${IMAGE_REF:-state-driven}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
