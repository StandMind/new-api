name: Build image and deploy

on:
  push:
    branches:
      - aivrae/main
      - aivrae
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY,,}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd '[:alnum:].-')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          version="deploy-${safe_ref}-${short_sha}"
          image="${REGISTRY}/${repository}:${safe_ref}"

          echo "${version}" > VERSION
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "safe-ref=${safe_ref}" >> "${GITHUB_OUTPUT}"
          echo "short-sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image-ref=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ vars.DEPLOY_IMAGE_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.safe-ref }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}:sha-${{ steps.image.outputs.short-sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Image" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.image.outputs.image-ref }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.VPS_USER || 'root' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.VPS_NEW_API_PATH || '/opt/new-api-stack' }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || vars.DEPLOY_COMPOSE_FILE || 'docker-compose.yml' }}
      DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
      DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}

    steps:
      - name: Validate deploy settings
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"

          if [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          else
            ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" > "${HOME}/.ssh/known_hosts"
          fi
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Pull image and restart service
        shell: bash
        run: |
          set -euo pipefail

          quote() {
            printf '%q' "$1"
          }

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${DEPLOY_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_REF=$(quote "${IMAGE_REF}") DEPLOY_PATH=$(quote "${DEPLOY_PATH}") DEPLOY_COMPOSE_FILE=$(quote "${DEPLOY_COMPOSE_FILE}") DEPLOY_REGISTRY_USERNAME=$(quote "${DEPLOY_REGISTRY_USERNAME}") DEPLOY_REGISTRY_TOKEN=$(quote "${DEPLOY_REGISTRY_TOKEN}") bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          compose() {
            if docker compose version >/dev/null 2>&1; then
              docker compose "$@"
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            else
              echo "docker compose or docker-compose is required" >&2
              return 1
            fi
          }

          if [ -n "${DEPLOY_REGISTRY_TOKEN:-}" ]; then
            if [ -z "${DEPLOY_REGISTRY_USERNAME:-}" ]; then
              echo "DEPLOY_REGISTRY_USERNAME is required when DEPLOY_REGISTRY_TOKEN is set" >&2
              exit 1
            fi
            printf '%s' "${DEPLOY_REGISTRY_TOKEN}" | docker login ghcr.io -u "${DEPLOY_REGISTRY_USERNAME}" --password-stdin
          fi

          if [ -x ./backup-db.sh ]; then
            ./backup-db.sh
          fi

          echo "Current new-api container:"
          docker ps --filter name='^/new-api$' --format '  {{.Names}} {{.Image}} {{.Status}}' || true

          cat > docker-compose.image.override.yml <<'EOF'
          services:
            new-api:
              image: ${NEW_API_IMAGE:?NEW_API_IMAGE is required}
          EOF

          export NEW_API_IMAGE="${IMAGE_REF}"
          compose -f "${DEPLOY_COMPOSE_FILE}" -f docker-compose.image.override.yml pull new-api
          compose -f "${DEPLOY_COMPOSE_FILE}" -f docker-compose.image.override.yml up -d --no-deps --force-recreate new-api

          for i in $(seq 1 60); do
            if docker exec new-api wget -q -O - http://127.0.0.1:3000/api/status | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "new-api health check passed"
              break
            fi
            if [ "${i}" -eq 60 ]; then
              echo "new-api health check failed" >&2
              docker logs --tail 200 new-api >&2 || true
              exit 1
            fi
            sleep 2
          done

          echo "Deployed new-api container:"
          docker ps --filter name='^/new-api$' --format '  {{.Names}} {{.Image}} {{.Status}}'

          docker image rm calciumion/new-api:latest >/dev/null 2>&1 || true
          docker image prune -f
          REMOTE
