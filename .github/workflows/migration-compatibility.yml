name: Migration compatibility

on:
  pull_request:
    branches:
      - aivrae/main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/migrations/**'
      - '.github/workflows/migration-compatibility.yml'
  push:
    branches:
      - aivrae/main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/migrations/**'
      - '.github/workflows/migration-compatibility.yml'

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare migration-only embedded assets
        run: |
          install -d web/default/dist web/classic/dist
          printf '<!doctype html><title>migration-only</title>\n' > web/default/dist/index.html
          printf '<!doctype html><title>migration-only</title>\n' > web/classic/dist/index.html

      - name: Build migration binary
        run: go build -o "${RUNNER_TEMP}/new-api" .

      - name: Create legacy access-policy options
        run: |
          sqlite3 "${RUNNER_TEMP}/migration.sqlite" <<'SQL'
          CREATE TABLE options (key text PRIMARY KEY, value text);
          INSERT INTO options(key, value) VALUES
            ('GroupRatio', '{"default":1,"route_a":1.3,"route_disabled":1.1}'),
            ('UserUsableGroups', '{"route_a":"Route A"}'),
            ('TopupGroupRatio', '{"default":1.2}'),
            ('ModelRequestRateLimitGroup', '{"default":[20,10]}'),
            ('GroupGroupRatio', '{"default":{"route_a":0.8}}'),
            ('group_ratio_setting.group_special_usable_group', '{}');
          SQL

      - name: Run expand and contract compatibility
        env:
          SQLITE_PATH: ${{ runner.temp }}/migration.sqlite?_busy_timeout=30000
          NODE_TYPE: master
          SESSION_SECRET: migration-compatibility-secret
          REDIS_CONN_STRING: redis://127.0.0.1:1
        run: |
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-sqlite"
          sqlite3 "${RUNNER_TEMP}/migration.sqlite" <<'SQL'
          ALTER TABLE users ADD COLUMN "group" varchar(64) DEFAULT 'default';
          ALTER TABLE subscription_plans ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE subscription_plans ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN prev_user_group varchar(64) DEFAULT '';
          UPDATE access_policy_states SET contracted_at = 0 WHERE id = 1;
          UPDATE route_groups SET enabled = 0 WHERE code = 'route_disabled';
          INSERT INTO route_groups(code, name, description, base_ratio, enabled, created_at, updated_at)
          VALUES ('route_later', 'Later route', '', 1, 1, 1, 1);
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-sqlite"
          sqlite3 "${RUNNER_TEMP}/migration.sqlite" <<'SQL'
          ALTER TABLE users DROP COLUMN "group";
          ALTER TABLE subscription_plans DROP COLUMN upgrade_group;
          ALTER TABLE subscription_plans DROP COLUMN downgrade_group;
          ALTER TABLE user_subscriptions DROP COLUMN upgrade_group;
          ALTER TABLE user_subscriptions DROP COLUMN downgrade_group;
          ALTER TABLE user_subscriptions DROP COLUMN prev_user_group;
          DELETE FROM options WHERE key IN (
            'GroupRatio', 'GroupGroupRatio', 'UserUsableGroups',
            'TopupGroupRatio', 'ModelRequestRateLimitGroup',
            'group_ratio_setting.group_special_usable_group'
          );
          UPDATE access_policy_states SET contracted_at = 123 WHERE id = 1;
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-sqlite-contract-1"
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-sqlite-contract-2"

      - name: Verify access-policy migration
        run: |
          db="${RUNNER_TEMP}/migration.sqlite"
          test "$(sqlite3 "${db}" "SELECT group_concat(route_group_code, '|') FROM (SELECT route_group_code FROM user_level_route_groups WHERE user_level_code='standard' ORDER BY route_group_code)")" = 'route_a|route_disabled'
          test "$(sqlite3 "${db}" "SELECT initial_route_group_codes FROM access_policy_states WHERE id=1")" = '["route_a","route_disabled"]'
          test "$(sqlite3 "${db}" "SELECT printf('%.1f', price_ratio) FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_a'")" = '0.8'
          test "$(sqlite3 "${db}" "SELECT COUNT(*) FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_later'")" = 0
          test "$(sqlite3 "${db}" "SELECT lower(type) FROM pragma_table_info('user_levels') WHERE name='topup_ratio'")" = real
          test "$(sqlite3 "${db}" "SELECT lower(type) FROM pragma_table_info('route_groups') WHERE name='base_ratio'")" = real
          test "$(sqlite3 "${db}" "SELECT lower(type) FROM pragma_table_info('user_level_route_groups') WHERE name='price_ratio'")" = real
          test "$(sqlite3 "${db}" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('user_levels','route_groups','user_level_route_groups','access_policy_states','access_policy_migration_guards')")" = 5
          test "$(sqlite3 "${db}" "SELECT COUNT(*) FROM (SELECT name FROM pragma_table_info('users') WHERE name='group' UNION ALL SELECT name FROM pragma_table_info('subscription_plans') WHERE name IN ('upgrade_group','downgrade_group') UNION ALL SELECT name FROM pragma_table_info('user_subscriptions') WHERE name IN ('upgrade_group','downgrade_group','prev_user_group'))")" = 0
          test "$(sqlite3 "${db}" "SELECT COUNT(*) FROM options WHERE key IN ('GroupRatio','GroupGroupRatio','UserUsableGroups','TopupGroupRatio','ModelRequestRateLimitGroup','group_ratio_setting.group_special_usable_group')")" = 0
          test "$(sqlite3 "${db}" "SELECT contracted_at FROM access_policy_states WHERE id=1")" = 123

  postgres:
    name: PostgreSQL ${{ matrix.version }} migration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '9.6'
            image: postgres:9.6
          - version: '15'
            image: postgres:15
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d newapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare migration-only embedded assets
        run: |
          install -d web/default/dist web/classic/dist
          printf '<!doctype html><title>migration-only</title>\n' > web/default/dist/index.html
          printf '<!doctype html><title>migration-only</title>\n' > web/classic/dist/index.html

      - name: Create legacy schema
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U test -d newapi <<'SQL'
          CREATE TABLE subscription_plans (
            id bigint PRIMARY KEY,
            title varchar(128) NOT NULL DEFAULT '',
            price_amount double precision NOT NULL DEFAULT 0
          );
          CREATE TABLE tokens (
            id bigint PRIMARY KEY,
            model_limits varchar(1024)
          );
          CREATE TABLE options (
            key varchar(255) PRIMARY KEY,
            value text
          );
          INSERT INTO options(key, value) VALUES
            ('GroupRatio', '{"default":1,"route_a":1.3,"route_disabled":1.1}'),
            ('UserUsableGroups', '{"route_a":"Route A"}'),
            ('TopupGroupRatio', '{"default":1.2}'),
            ('ModelRequestRateLimitGroup', '{"default":[20,10]}'),
            ('GroupGroupRatio', '{"default":{"route_a":0.8}}'),
            ('group_ratio_setting.group_special_usable_group', '{}');
          SQL

      - name: Build migration binary
        run: go build -o "${RUNNER_TEMP}/new-api" .

      - name: Run expand and contract compatibility
        env:
          SQL_DSN: postgresql://test:test@127.0.0.1:5432/newapi?sslmode=disable
          NODE_TYPE: master
          SESSION_SECRET: migration-compatibility-secret
          REDIS_CONN_STRING: redis://127.0.0.1:1
        run: |
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-postgres"
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U test -d newapi <<'SQL'
          ALTER TABLE users ADD COLUMN "group" varchar(64) DEFAULT 'default';
          ALTER TABLE subscription_plans ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE subscription_plans ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN prev_user_group varchar(64) DEFAULT '';
          UPDATE access_policy_states SET contracted_at = 0 WHERE id = 1;
          UPDATE route_groups SET enabled = FALSE WHERE code = 'route_disabled';
          INSERT INTO route_groups(code, name, description, base_ratio, enabled, created_at, updated_at)
          VALUES ('route_later', 'Later route', '', 1, TRUE, 1, 1);
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-postgres"
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U test -d newapi <<'SQL'
          ALTER TABLE users DROP COLUMN "group";
          ALTER TABLE subscription_plans DROP COLUMN upgrade_group, DROP COLUMN downgrade_group;
          ALTER TABLE user_subscriptions DROP COLUMN upgrade_group, DROP COLUMN downgrade_group, DROP COLUMN prev_user_group;
          DELETE FROM options WHERE key IN (
            'GroupRatio', 'GroupGroupRatio', 'UserUsableGroups',
            'TopupGroupRatio', 'ModelRequestRateLimitGroup',
            'group_ratio_setting.group_special_usable_group'
          );
          UPDATE access_policy_states SET contracted_at = 123 WHERE id = 1;
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-postgres-contract-1"
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-postgres-contract-2"

      - name: Verify migrated schema
        run: |
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='subscription_plans' AND column_name='price_amount'")" = numeric
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='tokens' AND column_name='model_limits'")" = text
          docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT to_regclass('public.system_tasks'), to_regclass('public.system_instances'), to_regclass('public.casbin_rule')" | grep -q 'system_tasks|system_instances|casbin_rule'
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT string_agg(route_group_code, '|' ORDER BY route_group_code) FROM user_level_route_groups WHERE user_level_code='standard'")" = 'route_a|route_disabled'
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT initial_route_group_codes FROM access_policy_states WHERE id=1")" = '["route_a","route_disabled"]'
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT price_ratio FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_a'")" = '0.800000000000000'
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT COUNT(*) FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_later'")" = 0
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT string_agg(table_name || '.' || column_name || ':' || data_type || '(' || numeric_precision || ',' || numeric_scale || ')', '|' ORDER BY table_name, column_name) FROM information_schema.columns WHERE table_schema='public' AND (table_name, column_name) IN (('user_levels','topup_ratio'),('route_groups','base_ratio'),('user_level_route_groups','price_ratio'))")" = 'route_groups.base_ratio:numeric(20,15)|user_level_route_groups.price_ratio:numeric(20,15)|user_levels.topup_ratio:numeric(20,15)'
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('user_levels','route_groups','user_level_route_groups','access_policy_states','access_policy_migration_guards')")" = 5
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND ((table_name='users' AND column_name='group') OR (table_name='subscription_plans' AND column_name IN ('upgrade_group','downgrade_group')) OR (table_name='user_subscriptions' AND column_name IN ('upgrade_group','downgrade_group','prev_user_group')))")" = 0
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT COUNT(*) FROM options WHERE key IN ('GroupRatio','GroupGroupRatio','UserUsableGroups','TopupGroupRatio','ModelRequestRateLimitGroup','group_ratio_setting.group_special_usable_group')")" = 0
          test "$(docker exec "${{ job.services.postgres.id }}" psql -At -U test -d newapi -c "SELECT contracted_at FROM access_policy_states WHERE id=1")" = 123

  mysql:
    name: MySQL 5.7 migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: newapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare migration-only embedded assets
        run: |
          install -d web/default/dist web/classic/dist
          printf '<!doctype html><title>migration-only</title>\n' > web/default/dist/index.html
          printf '<!doctype html><title>migration-only</title>\n' > web/classic/dist/index.html

      - name: Create legacy schema
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -ptest newapi <<'SQL'
          ALTER DATABASE newapi CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE TABLE subscription_plans (
            id bigint PRIMARY KEY,
            title varchar(128) NOT NULL DEFAULT '',
            price_amount double NOT NULL DEFAULT 0
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE TABLE tokens (
            id bigint PRIMARY KEY,
            model_limits varchar(1024)
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE TABLE options (
            `key` varchar(255) PRIMARY KEY,
            value text
          ) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          INSERT INTO options(`key`, value) VALUES
            ('GroupRatio', '{"default":1,"route_a":1.3,"route_disabled":1.1}'),
            ('UserUsableGroups', '{"route_a":"Route A"}'),
            ('TopupGroupRatio', '{"default":1.2}'),
            ('ModelRequestRateLimitGroup', '{"default":[20,10]}'),
            ('GroupGroupRatio', '{"default":{"route_a":0.8}}'),
            ('group_ratio_setting.group_special_usable_group', '{}');
          SQL

      - name: Build migration binary
        run: go build -o "${RUNNER_TEMP}/new-api" .

      - name: Run expand and contract compatibility
        env:
          SQL_DSN: root:test@tcp(127.0.0.1:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local
          NODE_TYPE: master
          SESSION_SECRET: migration-compatibility-secret
          REDIS_CONN_STRING: redis://127.0.0.1:1
        run: |
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-mysql"
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -ptest newapi <<'SQL'
          ALTER TABLE users ADD COLUMN `group` varchar(64) DEFAULT 'default';
          ALTER TABLE subscription_plans ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE subscription_plans ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN upgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN downgrade_group varchar(64) DEFAULT '';
          ALTER TABLE user_subscriptions ADD COLUMN prev_user_group varchar(64) DEFAULT '';
          UPDATE access_policy_states SET contracted_at = 0 WHERE id = 1;
          UPDATE route_groups SET enabled = 0 WHERE code = 'route_disabled';
          INSERT INTO route_groups(code, name, description, base_ratio, enabled, created_at, updated_at)
          VALUES ('route_later', 'Later route', '', 1, 1, 1, 1);
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-mysql"
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -ptest newapi <<'SQL'
          ALTER TABLE users DROP COLUMN `group`;
          ALTER TABLE subscription_plans DROP COLUMN upgrade_group, DROP COLUMN downgrade_group;
          ALTER TABLE user_subscriptions DROP COLUMN upgrade_group, DROP COLUMN downgrade_group, DROP COLUMN prev_user_group;
          DELETE FROM options WHERE `key` IN (
            'GroupRatio', 'GroupGroupRatio', 'UserUsableGroups',
            'TopupGroupRatio', 'ModelRequestRateLimitGroup',
            'group_ratio_setting.group_special_usable_group'
          );
          UPDATE access_policy_states SET contracted_at = 123 WHERE id = 1;
          SQL
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-mysql-contract-1"
          "${RUNNER_TEMP}/new-api" --migrate-only --log-dir "${RUNNER_TEMP}/logs-mysql-contract-2"

      - name: Verify migrated schema
        run: |
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='newapi' AND TABLE_NAME='subscription_plans' AND COLUMN_NAME='price_amount'")" = 'decimal(10,6)'
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='newapi' AND TABLE_NAME='tokens' AND COLUMN_NAME='model_limits'")" = text
          docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT GROUP_CONCAT(TABLE_NAME ORDER BY TABLE_NAME SEPARATOR '|') FROM information_schema.TABLES WHERE TABLE_SCHEMA='newapi' AND TABLE_NAME IN ('system_tasks','system_instances','casbin_rule')" | grep -q 'casbin_rule|system_instances|system_tasks'
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT GROUP_CONCAT(route_group_code ORDER BY route_group_code SEPARATOR '|') FROM user_level_route_groups WHERE user_level_code='standard'")" = 'route_a|route_disabled'
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT initial_route_group_codes FROM access_policy_states WHERE id=1")" = '["route_a","route_disabled"]'
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT price_ratio FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_a'")" = '0.800000000000000'
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT COUNT(*) FROM user_level_route_groups WHERE user_level_code='standard' AND route_group_code='route_later'")" = 0
          docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT TABLE_NAME, COLUMN_NAME, COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='newapi' AND ((TABLE_NAME='user_levels' AND COLUMN_NAME='topup_ratio') OR (TABLE_NAME='route_groups' AND COLUMN_NAME='base_ratio') OR (TABLE_NAME='user_level_route_groups' AND COLUMN_NAME='price_ratio')) ORDER BY TABLE_NAME, COLUMN_NAME"
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='newapi' AND DATA_TYPE='decimal' AND NUMERIC_PRECISION=20 AND NUMERIC_SCALE=15 AND ((TABLE_NAME='user_levels' AND COLUMN_NAME='topup_ratio') OR (TABLE_NAME='route_groups' AND COLUMN_NAME='base_ratio') OR (TABLE_NAME='user_level_route_groups' AND COLUMN_NAME='price_ratio'))")" = 3
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='newapi' AND TABLE_NAME IN ('user_levels','route_groups','user_level_route_groups','access_policy_states','access_policy_migration_guards')")" = 5
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='newapi' AND ((TABLE_NAME='users' AND COLUMN_NAME='group') OR (TABLE_NAME='subscription_plans' AND COLUMN_NAME IN ('upgrade_group','downgrade_group')) OR (TABLE_NAME='user_subscriptions' AND COLUMN_NAME IN ('upgrade_group','downgrade_group','prev_user_group')))")" = 0
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT COUNT(*) FROM options WHERE \`key\` IN ('GroupRatio','GroupGroupRatio','UserUsableGroups','TopupGroupRatio','ModelRequestRateLimitGroup','group_ratio_setting.group_special_usable_group')")" = 0
          test "$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -ptest newapi -e "SELECT contracted_at FROM access_policy_states WHERE id=1")" = 123
